site_name: EvalRX
site_description: Failure case analysis for LLMs and VLMs
site_url: https://evalvitals.github.io/evalrx
repo_url: https://github.com/evalvitals/evalrx
repo_name: evalvitals/evalrx

# docs/index.html (the landing page) and docs/demo/ ride this same build as
# static files outside the nav; site-src/ is the landing page's own source
# (template.html + build.py + source fonts) and is excluded so it isn't
# published alongside the built docs/index.html it produces.
exclude_docs: site-src/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy

nav:
  - Overview: overview.md
  - Quickstart: quickstart.md
  - Command-Line Interface: cli.md
  - Exploratory Analysis (M2/M3): m2_analysis.md
  - Verification & Intervention (M4/M5): intervention.md
  - Stage Input/Output Reference: stage_io.md
  - Analyzer Zoo: analyzers.md
  - Architecture: architecture.md
  - Extending: extending.md
  - Roadmap: roadmap.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - admonition
  - tables