name: CI

on:
  push:
    branches: [main, ruinan, jiaqiliu]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: evalrx/reporting/web/package-lock.json
      - name: Build the report UI
        # web_dist/ is gitignored (a build output, not source) and this repo
        # ships no other build step for it -- without this, GET / in the
        # dynamic report server has no index.html to serve and falls through
        # to a JSON response, which is what test_dynamic_api_filters_and_serves_spa
        # (and every other SPA-serving test) actually catches.
        run: |
          cd evalrx/reporting/web
          npm ci
          npm run build
      - name: Install torch (CPU-only, for test fixtures)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package + dev deps
        # local/api/data/finetune/viz are all fixture-only needs (transformers,
        # accelerate, openai, pillow, datasets, peft, matplotlib) -- torch is
        # already satisfied by the CPU wheel above so this step won't pull a
        # CUDA build. Without these, every test guarded by
        # pytest.importorskip() for one of them silently never runs in CI at
        # all -- which is how 16+ failures and a 4-more-hidden-behind-them
        # matplotlib gap went unnoticed.
        # The dynamic report server (evalrx.reporting.dynamic) is FastAPI-
        # backed since the Streamlit dashboard's removal (`ui` extra, not the
        # stale `dashboard` extra pyproject.toml no longer defines) -- without
        # it, tests/test_analysis/test_dynamic_report.py fails at import with
        # ModuleNotFoundError: No module named 'fastapi' instead of running.
        run: pip install -e ".[dev,local,api,data,finetune,viz,ui,contract]"
      - name: Check the generated contract artifacts are current
        # docs/contract/*.schema.json and contract.d.ts are generated from
        # evalrx/contract/. A field added in Python and not regenerated here
        # is a field the frontend cannot see, which is the drift the contract
        # exists to catch -- so catch it on the commit that causes it.
        run: python -m evalrx.contract.export --out docs/contract --check
      - name: Run fast unit tests
        run: pytest -m "not gpu and not network" --cov=evalrx --cov-report=xml -q
      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
