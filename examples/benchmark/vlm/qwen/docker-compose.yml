# VLM (image + text) x Qwen: one service per size, dataset/limit via env.
#   DATASET=chartqa LIMIT=256 CUDA_VISIBLE_DEVICES=0 docker compose run -d --name vlm-qwen3.5-2b-chartqa qwen3.5-2b
# Datasets for this modality: chartqa, spatial457, pope_random, pope_popular, pope_adversarial.
# EXTRA_ARGS passes more run.py flags (e.g. EXTRA_ARGS='--baseline-only --limit 8').
# Judge/coder are pinned to Codex gpt-5.6-terra at medium effort.
name: bench-vlm-qwen
x-qwen: &qwen
  extends:
    file: ../../_common/compose/base.yml
    service: bench
  image: evalrx-bench-qwen
  build:
    context: ../../../..
    dockerfile: examples/benchmark/docker/Dockerfile
    target: qwen
  volumes:
    - ../_data:/app/work/data        # frozen manifests + media, shared by every family of the modality
    - ./outputs:/app/work/outputs    # <model>/<dataset>[.<tag>]/{baseline.json,logs,explore,summary.json}
services:
  qwen3.5-2b:
    <<: *qwen
    command: >
      sh -c "python -m _common.run --modality vlm --model qwen3.5-2b --dataset ${DATASET:-chartqa} --limit ${LIMIT:-256} --judge-provider codex --judge-model gpt-5.6-terra --judge-effort medium ${EXTRA_ARGS:-}"
  qwen3.5-4b:
    <<: *qwen
    command: >
      sh -c "python -m _common.run --modality vlm --model qwen3.5-4b --dataset ${DATASET:-chartqa} --limit ${LIMIT:-256} --judge-provider codex --judge-model gpt-5.6-terra --judge-effort medium ${EXTRA_ARGS:-}"
  qwen3.5-9b:
    <<: *qwen
    command: >
      sh -c "python -m _common.run --modality vlm --model qwen3.5-9b --dataset ${DATASET:-chartqa} --limit ${LIMIT:-256} --judge-provider codex --judge-model gpt-5.6-terra --judge-effort medium ${EXTRA_ARGS:-}"
