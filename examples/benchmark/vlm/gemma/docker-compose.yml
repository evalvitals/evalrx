# VLM (image + text) x Gemma 4: one service per size, dataset/limit via env.
#   DATASET=chartqa LIMIT=256 CUDA_VISIBLE_DEVICES=0 docker compose run -d --name vlm-gemma-4-e2b-chartqa gemma-4-e2b
# Datasets for this modality: chartqa, spatial457, pope_random, pope_popular, pope_adversarial.
# EXTRA_ARGS passes more run.py flags (e.g. EXTRA_ARGS='--baseline-only --limit 8').
# Judge/coder are pinned to Codex gpt-5.6-terra at medium effort.
name: bench-vlm-gemma
x-gemma: &gemma
  extends:
    file: ../../_common/compose/base.yml
    service: bench
  image: evalrx-bench-gemma
  build:
    context: ../../../..
    dockerfile: examples/benchmark/docker/Dockerfile
    target: gemma
  volumes:
    - ../_data:/app/work/data        # frozen manifests + media, shared by every family of the modality
    - ./outputs:/app/work/outputs    # <model>/<dataset>[.<tag>]/{baseline.json,logs,explore,summary.json}
services:
  gemma-4-e2b:
    <<: *gemma
    command: >
      sh -c "python -m _common.run --modality vlm --model gemma-4-e2b --dataset ${DATASET:-chartqa} --limit ${LIMIT:-0} --judge-provider codex --judge-model gpt-5.6-terra --judge-effort medium ${EXTRA_ARGS:-}"
  gemma-4-e4b:
    <<: *gemma
    command: >
      sh -c "python -m _common.run --modality vlm --model gemma-4-e4b --dataset ${DATASET:-chartqa} --limit ${LIMIT:-0} --judge-provider codex --judge-model gpt-5.6-terra --judge-effort medium ${EXTRA_ARGS:-}"
  gemma-4-12b:
    <<: *gemma
    command: >
      sh -c "python -m _common.run --modality vlm --model gemma-4-12b --dataset ${DATASET:-chartqa} --limit ${LIMIT:-0} --judge-provider codex --judge-model gpt-5.6-terra --judge-effort medium ${EXTRA_ARGS:-}"
