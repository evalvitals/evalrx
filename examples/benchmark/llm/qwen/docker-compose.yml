# LLM (text only) x Qwen: one service per size, dataset/limit via env.
#   DATASET=bbh_causal_judgement LIMIT=256 CUDA_VISIBLE_DEVICES=0 docker compose run -d --name llm-qwen3.5-2b-bbh_causal_judgement qwen3.5-2b
# Datasets for this modality: cruxeval_output, bbh_causal_judgement, supergpqa_economics, bbh_word_sorting, bbh_tracking7, bamboogle, minervamath, supergpqa_law, supergpqa_medicine_hard, hotpotqa_gepa, gsm8k.
# EXTRA_ARGS passes more run.py flags (e.g. EXTRA_ARGS='--baseline-only --limit 8').
# Backend: llm cells default to --backend endpoint (OpenAI-compatible server at --base-url,
#   default http://host.docker.internal:8020/v1 = a vLLM server on the host); EXTRA_ARGS='--backend hf_local' runs in-process.
# Judge/coder are pinned to Codex gpt-5.6-terra at medium effort.
name: bench-llm-qwen
x-qwen: &qwen
  extends:
    file: ../../_common/compose/base.yml
    service: bench
  image: evalrx-bench-qwen
  build:
    context: ../../../..
    dockerfile: examples/benchmark/docker/Dockerfile
    target: qwen
  volumes:
    - ../_data:/app/work/data        # frozen manifests + media, shared by every family of the modality
    - ./outputs:/app/work/outputs    # <model>/<dataset>[.<tag>]/{baseline.json,logs,explore,summary.json}
services:
  qwen3.5-2b:
    <<: *qwen
    command: >
      sh -c "python -m _common.run --modality llm --model qwen3.5-2b --dataset ${DATASET:-bbh_causal_judgement} --limit ${LIMIT:-0} ${EXTRA_ARGS:-}"
  qwen3.5-4b:
    <<: *qwen
    command: >
      sh -c "python -m _common.run --modality llm --model qwen3.5-4b --dataset ${DATASET:-bbh_causal_judgement} --limit ${LIMIT:-0} ${EXTRA_ARGS:-}"
  qwen3.5-9b:
    <<: *qwen
    command: >
      sh -c "python -m _common.run --modality llm --model qwen3.5-9b --dataset ${DATASET:-bbh_causal_judgement} --limit ${LIMIT:-0} ${EXTRA_ARGS:-}"
