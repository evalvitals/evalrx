# LLM (text only) x Gemma 4: one service per size, dataset/limit via env.
#   DATASET=bbh_causal_judgement LIMIT=256 CUDA_VISIBLE_DEVICES=0 docker compose run -d --name llm-gemma-4-e2b-bbh_causal_judgement gemma-4-e2b
# Datasets for this modality: cruxeval_output, bbh_causal_judgement, supergpqa_economics, bbh_word_sorting, bbh_tracking7, bamboogle, minervamath, supergpqa_law, supergpqa_medicine_hard, hotpotqa_gepa, gsm8k.
# EXTRA_ARGS passes more run.py flags (e.g. EXTRA_ARGS='--baseline-only --limit 8').
# Judge/coder are pinned to Codex gpt-5.6-terra at medium effort.
name: bench-llm-gemma
x-gemma: &gemma
  extends:
    file: ../../_common/compose/base.yml
    service: bench
  image: evalvitals-bench-gemma
  build:
    context: ../../../..
    dockerfile: examples/benchmark/docker/Dockerfile
    target: gemma
  volumes:
    - ../_data:/app/work/data        # frozen manifests + media, shared by every family of the modality
    - ./outputs:/app/work/outputs    # <model>/<dataset>[.<tag>]/{baseline.json,logs,explore,summary.json}
services:
  gemma-4-e2b:
    <<: *gemma
    command: >
      sh -c "python -m _common.run --modality llm --model gemma-4-e2b --dataset ${DATASET:-bbh_causal_judgement} --limit ${LIMIT:-256} --judge-provider codex --judge-model gpt-5.6-terra --judge-effort medium ${EXTRA_ARGS:-}"
  gemma-4-e4b:
    <<: *gemma
    command: >
      sh -c "python -m _common.run --modality llm --model gemma-4-e4b --dataset ${DATASET:-bbh_causal_judgement} --limit ${LIMIT:-256} --judge-provider codex --judge-model gpt-5.6-terra --judge-effort medium ${EXTRA_ARGS:-}"
  gemma-4-12b:
    <<: *gemma
    command: >
      sh -c "python -m _common.run --modality llm --model gemma-4-12b --dataset ${DATASET:-bbh_causal_judgement} --limit ${LIMIT:-256} --judge-provider codex --judge-model gpt-5.6-terra --judge-effort medium ${EXTRA_ARGS:-}"
