# Shared service templates for every examples/benchmark leaf (docker compose `extends`).
# Mount SOURCES are variables with portable defaults, so a host whose docker daemon
# cannot traverse $HOME (tealab: root-squashed NFS) sets them once in
# examples/benchmark/.env (each leaf links to it) instead of overriding volumes.
#
#   bench-core  everything but the GPU reservation: the API-model family (gemini,
#               --backend gemini) extends this — it needs the harness, the judge /
#               coder CLIs and the data mounts, not a card.
#   bench       bench-core + the NVIDIA reservation: the hf_local families
#               (qwen / gemma / nemotron) extend this.
services:
  bench-core:
    working_dir: /app/work
    environment:
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - HF_HOME=/hf_cache
      - HF_TOKEN=${HF_TOKEN:-}
      # Gemini API family (--backend gemini): the key is read from the environment.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # claude reads its OAuth state from $HOME; IS_SANDBOX lets it accept
      # --dangerously-skip-permissions as root.
      - HOME=/home/user
      - CODEX_HOME=/home/user/.codex
      - PATH=/opt/codex/bin:/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
      - IS_SANDBOX=1
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/examples/benchmark
    volumes:
      - ${EVALVITALS_HF_CACHE:-~/.cache/huggingface}:/hf_cache
      # Judge + coder CLI (ClaudeModel / claude_code): the NATIVE claude binary.
      - ${CLAUDE_PATH:-~/.local/bin/claude}:/usr/local/bin/claude:ro
      - ${CLAUDE_HOME:-~/.claude}:/home/user/.claude
      - ${CLAUDE_JSON:-~/.claude.json}:/home/user/.claude.json
      # Codex judge + coder. Mount the npm package beside its Node runtime so
      # the package-relative native executable remains discoverable.
      - ${CODEX_NODE:-~/.nvm/versions/node/current/bin/node}:/usr/local/bin/node:ro
      - ${CODEX_PACKAGE:-~/.nvm/versions/node/current/lib/node_modules/@openai/codex}:/opt/codex:ro
      - ${CODEX_HOME:-~/.codex}:/home/user/.codex
      # Optional alternate judge/coder: --judge-provider agy (Antigravity CLI,
      # no OpenAI/Anthropic API key needed — see
      # evalvitals/agent_runtime/judges/agy.py). Harmless to mount when unused.
      - ${AGY_PATH:-~/.local/bin/agy}:/usr/local/bin/agy:ro
      - ${AGY_GEMINI_HOME:-~/.gemini}:/home/user/.gemini
      - ${AGY_CACHE_HOME:-~/.cache/antigravity}:/home/user/.cache/antigravity
    # --backend endpoint reaches a vLLM server on the host at host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
  bench:
    extends:
      service: bench-core
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
