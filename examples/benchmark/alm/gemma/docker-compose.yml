# ALM (audio + text) x Gemma 4: one service per size, dataset/limit via env.
#   DATASET=mmau LIMIT=256 CUDA_VISIBLE_DEVICES=0 docker compose run -d --name alm-gemma-4-e2b-mmau gemma-4-e2b
# Datasets for this modality: mmau, audiocaps_hallu.
# EXTRA_ARGS passes more run.py flags (e.g. EXTRA_ARGS='--baseline-only --limit 8').
# Judge/coder are pinned to Claude Opus 5 here; the CLI default provider is agy.
name: bench-alm-gemma
x-gemma: &gemma
  extends:
    file: ../../_common/compose/base.yml
    service: bench
  image: evalvitals-bench-gemma
  build:
    context: ../../../..
    dockerfile: examples/benchmark/docker/Dockerfile
    target: gemma
  volumes:
    - ../_data:/app/work/data        # frozen manifests + media, shared by every family of the modality
    - ./outputs:/app/work/outputs    # <model>/<dataset>[.<tag>]/{baseline.json,logs,explore,summary.json}
services:
  gemma-4-e2b:
    <<: *gemma
    command: >
      sh -c "python -m _common.run --modality alm --model gemma-4-e2b --dataset ${DATASET:-mmau} --limit ${LIMIT:-256} --judge-provider claude --judge-model claude-opus-5 --judge-effort high ${EXTRA_ARGS:-}"
  gemma-4-e4b:
    <<: *gemma
    command: >
      sh -c "python -m _common.run --modality alm --model gemma-4-e4b --dataset ${DATASET:-mmau} --limit ${LIMIT:-256} --judge-provider claude --judge-model claude-opus-5 --judge-effort high ${EXTRA_ARGS:-}"
  gemma-4-12b:
    <<: *gemma
    command: >
      sh -c "python -m _common.run --modality alm --model gemma-4-12b --dataset ${DATASET:-mmau} --limit ${LIMIT:-256} --judge-provider claude --judge-model claude-opus-5 --judge-effort high ${EXTRA_ARGS:-}"
