# Host-specific mount overrides (tealab): the docker daemon cannot traverse the
# root-squashed NFS home, so every mount source lives on /tealab-data instead.
# claude-bin is the NATIVE binary copied out of ~/.local/share/claude/versions;
# claude-home holds only .credentials.json (chmod-700 parent dir).
services:
  mmau_qwen2_audio:
    volumes:
      - /tealab-data/jiaqiliu/mmau_env/hf_cache:/hf_cache
      - ./outputs:/app/example/outputs
      - ./data:/app/example/data
      - /tealab-data/jiaqiliu/mmau_env/claude-bin:/usr/local/bin/claude:ro
      - /tealab-data/jiaqiliu/mmau_env/claude-home:/home/user/.claude
      - /tealab-data/jiaqiliu/mmau_env/claude.json:/home/user/.claude.json
