services:
  mmau_qwen2_audio:
    environment:
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - CUDA_VISIBLE_DEVICES=7
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - HF_HOME=/hf_cache
      - HOME=/home/user
      - IS_SANDBOX=1
    volumes:
      - /data/rjin02/.cache/huggingface:/hf_cache
      - ./outputs:/app/example/outputs
      - ./data:/app/example/data
      - /data/rjin02/.local/bin/agy:/usr/local/bin/agy:ro
      - /data/rjin02/.gemini:/home/user/.gemini
      - /data/rjin02/.cache/antigravity:/home/user/.cache/antigravity

