services:
  musicavqa_videollama2:
    build:
      context: ../../..
      dockerfile: examples/m1_m4/musicavqa_videollama2/Dockerfile
    image: evalvitals-musicavqa-videollama2
    environment:
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - HF_HOME=/hf_cache
      # claude reads its OAuth state from $HOME; IS_SANDBOX lets it accept
      # --dangerously-skip-permissions as root. Mirrors deco_chair.
      - HOME=/home/user
      - IS_SANDBOX=1
    volumes:
      - ${HF_HOME:-~/.cache/huggingface}:/hf_cache
      - ./outputs:/app/example/outputs
      - ./data:/app/example/data
      # Music-AVQA (videos + avqa-*.json) and the VideoLLaMA2.1-7B-AV checkpoint
      # — default to this project's Drive layout; override for other hosts.
      - ${AVQA_DATA_DIR:-/content/drive/MyDrive/av_llm_project/datasets/Music-AVQA}:/data/Music-AVQA:ro
      - ${AVQA_MODEL_DIR:-/content/drive/MyDrive/av_llm_project/models/VideoLLaMA2.1-7B-AV}:/data/VideoLLaMA2.1-7B-AV:ro
      # Judge for M2/M3/M5 (ClaudeModel) — mount the NATIVE claude binary:
      #   export CLAUDE_PATH=$(ls -d ~/.vscode-server/extensions/anthropic.claude-code-*/resources/native-binary/claude | sort -V | tail -1)
      - ${CLAUDE_PATH:-~/.local/bin/claude}:/usr/local/bin/claude:ro
      - ~/.claude:/home/user/.claude
      - ~/.claude.json:/home/user/.claude.json
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      python run.py --model videollama2.1-7b-av
                     --model-path /data/VideoLLaMA2.1-7B-AV
                     --device cuda
