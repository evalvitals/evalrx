services:
  chartqa_qwen3_5_2b:
    build:
      context: ../../..
      dockerfile: examples/m1_m4/chartqa_qwen3_5_2b/Dockerfile
    image: evalvitals-chartqa-qwen3-5-2b
    environment:
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - HF_HOME=/hf_cache
      - HOME=/home/user
      - IS_SANDBOX=1
    volumes:
      - ${HF_HOME:-~/.cache/huggingface}:/hf_cache
      - ./data:/app/example/data
      - ./outputs:/app/example/outputs
      - ${CLAUDE_PATH:-~/.local/bin/claude}:/usr/local/bin/claude:ro
      - ~/.claude:/home/user/.claude
      - ~/.claude.json:/home/user/.claude.json
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Judge = claude (sonnet, high effort). The frozen sample is deterministic
    # (seeded), so re-running the downloader is a no-op once data/ exists.
    command: >
      sh -c "python download_chartqa.py --limit 256 --seed 5022 && python run.py --limit 256 --judge-provider claude --judge-model claude-opus-5 --judge-effort high --run-dir outputs"
