services:
  audiocaps_hallucination_qwen2_audio:
    build:
      context: ../../..
      dockerfile: examples/m1_m5/audiocaps_hallucination_qwen2_audio/Dockerfile
    image: evalrx-audiocaps-hallucination-qwen2-audio
    environment:
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - HF_HOME=/hf_cache
      # claude reads its OAuth state from $HOME; IS_SANDBOX lets it accept
      # --dangerously-skip-permissions as root. Mirrors mmau_qwen2_audio.
      - HOME=/home/user
      - IS_SANDBOX=1
    volumes:
      - ${HF_HOME:-~/.cache/huggingface}:/hf_cache
      - ./outputs:/app/example/outputs
      - ./data:/app/example/data   # downloaded manifest + decoded WAVs
      # Judge for M2/M3/M4 + FixAgent's L1/L2 proposal tiers (ClaudeModel) —
      # mount the NATIVE claude binary:
      #   export CLAUDE_PATH=$(ls -d ~/.vscode-server/extensions/anthropic.claude-code-*/resources/native-binary/claude | sort -V | tail -1)
      - ${CLAUDE_PATH:-~/.local/bin/claude}:/usr/local/bin/claude:ro
      - ~/.claude:/home/user/.claude
      - ~/.claude.json:/home/user/.claude.json
      # Optional alternate judge/coder: --judge-provider agy (Antigravity CLI,
      # no Anthropic API key needed — see evalrx/agent_runtime/judges/agy.py).
      # Only exercised when run.py is invoked with --judge-provider agy; harmless
      # to mount otherwise. Set AGY_PATH if `agy` isn't at ~/.local/bin/agy.
      - ${AGY_PATH:-~/.local/bin/agy}:/usr/local/bin/agy:ro
      - ~/.gemini:/home/user/.gemini
      - ~/.cache/antigravity:/home/user/.cache/antigravity
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      sh -c "python download_audiohallucination.py --limit 300 --scan-rows 2000 && python run.py --model qwen2-audio-7b-instruct --limit 300 --judge-provider claude --judge-model claude-opus-5 --judge-effort high"
