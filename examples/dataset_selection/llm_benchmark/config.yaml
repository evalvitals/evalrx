# llm_benchmark — text-LLM diagnosis on the band-located datasets.
#
# Every dataset listed in datasets.py was MEASURED into the 30-70% band on
# Qwen3.5-9B. The band is a property of the (model, dataset) PAIR, so on 2B/4B
# the same slice may be floored or saturated -- build_cases.py prints the
# realised accuracy and refuses to go on outside [0.15, 0.85].

# Model under test: served by vLLM, addressed over an OpenAI-compatible endpoint.
model: qwen3.5-9b                    # served-model-name, not the HF repo id
base_url: http://127.0.0.1:8020/v1
dataset: supergpqa_law               # see datasets.py for the eight

# Sampling. Greedy decoding sends Qwen thinking models into verbatim
# self-verification loops that run to the token cap -- never set temperature 0.
temperature: 0.6
top_p: 0.95
top_k: 20
max_tokens: 20480

# Cases in the batch. 0 = FULL CENSUS of the slice (the default).
#
# A slice size is a hard ceiling anyway -- asking 240 of the 125-item bamboogle
# yields 125 -- so capping only shrinks the sets that could afford more, while
# doing nothing for the ones that could not. Taking every item removes sampling
# variability from the batch entirely: the PASS/FAIL split IS the slice, not a
# draw from it, and two runs on the same model see the same items.
#
# Cost, from measured throughput at concurrency 16 (one model, all eight):
#   supergpqa_economics 873 ~6h30m   cruxeval_output 800 ~3h25m
#   supergpqa_law       656 ~4h30m   minervamath     272 ~5h30m
#   supergpqa_med_hard  217 ~2h00m   bamboogle       125 ~1h15m
#   bbh_causal_judge    187 ~0h40m   bbh_tracking7   250 ~0h20m
#   -> ~24h per model size. Run ONE dataset at a time; do not queue all eight
#      blindly. Pass an explicit n (./run_all.sh <model> <dataset> 120) to cap.
n_cases: 0
concurrency: 16

# Logprobs over the SAME vLLM endpoint (it supports them; only our wrapper used
# to throw them away). Unlocks the `logprob_entropy` and `calibration`
# analyzers -- "is the model confidently wrong or hesitantly wrong" -- at no GPU
# cost beyond a ~64-token continuation per case.
#
# mode decides WHICH continuation is scored, and for a thinking model that is
# the whole question:
#   answer (default) — sends enable_thinking=False, so the scored tokens are the
#                      answer itself. Caveat: labels came from full thinking, so
#                      this pairs no-think confidence with think-mode
#                      correctness. Reads as "does it know this without working".
#   chain            — scores the raw continuation with thinking on. Faithful to
#                      how the batch was made, but the first tokens are chain
#                      boilerplate whose probability barely moves between a
#                      right and a wrong answer, so confidence comes out flat.
logprobs_mode: answer
logprobs_max_tokens: 64
logprobs_top_k: 5

# Judge (M1 selection / M2 narrative / M3 hypotheses / M5 verdicts) and the
# codegen coder for M2 statistics. Both are `claude -p` CLI calls, NOT the model
# under test -- the model under test is the one vLLM is serving.
#
# `claude --model` takes either an alias ('opus') or a pinned full name. Pinned
# here on purpose: an alias silently follows whatever the latest opus becomes,
# and a judge that changes underneath a run makes two runs incomparable.
judge_model: claude-opus-5
judge_effort: high        # low | medium | high | xhigh | max
codegen_model: claude-opus-5
codegen_effort: high
# high effort costs more per call and thinks longer, so the budget and the
# per-call timeout both have to come up with it or M2 codegen gets cut off
# mid-solution and the stage reports a failure that is really a timeout.
# These are CEILINGS, not spend: the coder stops when the work is done. Set them
# generously -- a cut-off M2 wastes the whole GPU-bound batch that preceded it,
# which costs far more than the difference.
codegen_budget_usd: 25.0
codegen_timeout_sec: 1800
judge_timeout_sec: 600      # ONE judge call (M2 narrative, M3, M5, fix proposals). The wrapper's 240 s
                            # default was exceeded by M2's 11-analyzer prompt at opus/high on
                            # bbh_causal_judgement (2026-08-18) -> silent fallback to the threshold
                            # narrative. 600 s is still a bound, not an invitation to hang.

# In-cycle explore step: a free-form EDA pass (the same coder as M2 codegen,
# writing pandas in a sandbox) over the SAME per-case table the catalog M2
# analyses, run between M1 and M2. It writes tables/*.csv + rendered figures/*.png
# + exploratory_report.json under outputs/<model>/<dataset>/explore/ (the
# dashboard picks them up), and its observations/charts reach M3 as UNCONFIRMED
# notes that steer WHICH hypotheses get proposed. It never enters M2's
# confirmatory family, M5, or the fix gate -- the catalog M2 runs unchanged
# beside it. Cost: one coder-agent call per cycle (a few minutes) plus host-side
# chart rendering. `explore: false` (or EXPLORE=0 / --no-explore) turns it off.
explore: true
explore_timeout_sec: 1800    # per coder attempt. Measured on the 2026-08-18 smoke run (opus, effort
                             # high, 3 bundled skills, 30 rows): a complete pass took 746 s; at 900 s
                             # the FIRST attempt was killed mid-write and the retry paid the whole
                             # cost again (29 min total). Same ceiling as codegen_timeout_sec.
explore_max_attempts: 2      # a failed script gets one repair round, then the step is skipped

# M4 surgery
fix_max_tier: L3b
fix_validation_cases: 40    # 0 = whole batch. Candidates run serially (~10 s/case on the 2B), and an
                            # L2 coded pipeline makes 4-5 bridged calls per case: 250 cases cannot
                            # finish inside fix_exec_timeout_sec, so it is killed as "timed out"
                            # instead of being judged. The paired gate does not need the whole batch.
fix_exec_timeout_sec: 7200  # wall-clock per coded-pipeline run. Measured 16 s per bridged call
                            # on the 2B (long direct answers): 80 cases x ~5 calls serial would be
                            # ~1.8 h, which is why the bridge now services calls concurrently
                            # (fix_concurrency below; since 2026-08-19 requests are id-tagged and
                            # the coder is told model_generate is thread-safe). The first attempt
                            # must be able to finish, or every coded candidate spends its one
                            # repair round on the timeout instead of on the repair.
fix_concurrency: 12         # parallel model calls in the fix stage: threads per DECLARATIVE
                            # candidate (L1 templates / L2 specs) over the validation batch, the
                            # 5-sample baseline, AND how many bridged calls a coded pipeline gets
                            # serviced at once. vLLM batches them; Stage 0 runs 16. 1 = serial.
fix_floor_candidates:       # built-in defaults ALWAYS in the tested family for a text-only batch,
  - self_consistency_5      # next to the judge's proposals (5 samples, vote on the extracted
                            # final answer). Before 2026-08-18 defaults were only a fallback for
                            # a silent judge, so plain self-consistency was never tested. [] = off.
fix_baseline_repeats: 5     # baseline samples per case = frozen Stage 0 output + 4 fresh at the
                            # batch's own T. Each case gets a PASS RATE and the paired test runs
                            # on rate differences (betting e-value): a case the baseline gets right
                            # 2/5 of the time and a candidate gets right counts +0.6, not +1, and
                            # a fragile "correct" case the candidate misses counts -(its rate), not
                            # -1. On the 2B at T=0.6 one sample per arm let sampling noise decide
                            # (run7: 10 fixed / 1 broken, e=15.5, one break short). 1 = old McNemar.
fix_candidate_repeats: 1    # passes per template/spec candidate (coded pipelines always 1). >1
                            # multiplies candidate cost; the baseline side is where the noise was.
fix_on_unverified: true     # when M5 verified nothing: still run the M4 intervention experiment on
                            # the best UNVERIFIED hypothesis, then the fix stage on the best
                            # unverified leads (flagged "UNVERIFIED" to the proposer). The fix gate
                            # is the paired candidate validation, not the hypothesis, so this is
                            # safe; false = old behaviour (verified only). CLI: --[no-]fix-unverified.

# Cap on how many cases each per-case analyzer generates for. 0 = library
# defaults (128 for prompt_contrast / calibration / linear_probe, 48 for
# format_sensitivity, ...).
#
# This is the main knob on M1 wall-clock, because analyzers run in parallel with
# EACH OTHER but iterate their own cases SERIALLY, one generate() at a time.
# Measured against the 9B over the endpoint: ~49 s per call, so a 128-case
# analyzer is a ~2 h straggler. On bbh_tracking7 the observed concurrency fell
# 5.3 -> 1.0 and sat at 1.0 for four hours while one analyzer finished alone.
#
# It costs statistical power, not correctness -- same measurement, fewer of
# them. run_pipeline prints exactly which analyzers were capped and records it
# in summary.json, so a wide interval downstream is not misread as a null.
analyzer_max_cases: 32

max_cycles: 3
# Fraction of the batch held out from M1-M5 so M4 validates its fix on data the
# loop never mined. 0.5 is a 1:1 explore/confirm split -- the loop mines half and
# the fix is scored on the other half, which it never saw.
#
# The cost is power on both sides: at n_cases 120 each half is 60, so a mid-band
# dataset leaves ~30 PASS and ~30 FAIL per half. Raise n_cases with this, or the
# split buys leak-freedom with intervals too wide to conclude from.
confirm_split: 0.5
