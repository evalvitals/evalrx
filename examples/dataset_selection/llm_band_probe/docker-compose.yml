services:
  llm_band_probe:
    build:
      context: ../../..
      dockerfile: examples/dataset_selection/llm_band_probe/Dockerfile
    image: evalrx-llm-band-probe
    # No local model load -- band_locate.py/probe_validate.py are HTTP clients
    # against an already-served OpenAI-compatible endpoint (e.g. `vllm serve`
    # on the host). host.docker.internal resolves to the host from inside the
    # container (Linux needs the extra_hosts entry below; Docker Desktop has
    # it built in).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - BAND_BASE_URL=${BAND_BASE_URL:-http://host.docker.internal:8020/v1}
      - BAND_MODEL_ID=${BAND_MODEL_ID:-qwen3.5-9b}
    volumes:
      - ./outputs:/app/example/outputs
