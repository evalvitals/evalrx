services:
  visual_zoom_agent:
    build:
      context: ../../..
      dockerfile: examples/agent_demos/visual_zoom_agent/Dockerfile
    image: evalvitals-visual-zoom-agent
    environment:
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - HF_HOME=/hf_cache
    volumes:
      - ${HF_HOME:-~/.cache/huggingface}:/hf_cache
      - ./outputs:/app/example/outputs
      # run.py's DEFAULT_IMAGE is a bare-checkout-relative path (2 levels up
      # to examples/) that does not resolve at Docker's directory depth
      # (WORKDIR is examples/agent_demos/visual_zoom_agent's OWN contents
      # flattened to /app/example, one level shallower than the repo tree).
      # Mount the one sample image this needs directly and pass --image
      # explicitly instead of fighting that path depth.
      - ../../m1_m4/deco_pope/data/images/COCO_val2014_000000006033.jpg:/app/example/sample.jpg:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      python run.py --device cuda --image /app/example/sample.jpg
